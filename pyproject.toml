[dependency-groups]
dev = [
    "prek>=0.5.3,<1.0.0",
    "typer>=0.27.2,<1.0.0",
    "zizmor>=1.30.1",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["backend", "agent"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
    # git/docker hashes and attempt ids in deploy logs
    "\\b[0-9a-f]{7,}\\b",
    # plural of a protocol method name
    "UNSUBSCRIBEs",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.typos.default.extend-words]
# strategy id "tripple_screen" is persisted in DB/protocol; keep the spelling
tripple = "tripple"
# Binance API field cummulativeQuoteQty
cummulative = "cummulative"
mis = "mis"
pn = "pn"
unparseable = "unparseable"

# session.execute() is deprecated in SQLModel, but exec() has no overload for
# text(). Not inline: _regroup_by_database's source is hashed into the preset
# pipeline version (PIPELINE_SOURCE_SHA256), so comments there would change it.
[[tool.ty.overrides]]
include = ["backend/app/core/builtin_presets.py"]
rules = { deprecated = "ignore" }
