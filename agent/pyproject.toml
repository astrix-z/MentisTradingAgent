[project]
name = "agent"
version = "0.1.0"
description = "Standalone trading agent: exchange/websocket daemon, independent of the FastAPI backend."
requires-python = ">=3.14,<4.0"
dependencies = [
    "pydantic-settings<3.0.0,>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "httpx<1.0.0,>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
]

[project.scripts]
mentis-agent = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
    "T201",  # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by formatter
]
